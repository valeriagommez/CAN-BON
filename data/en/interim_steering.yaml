introduction : 
  introduction_title : "Interim Steering Group"
  introduction_text : "CAN BON's **Interim Steering Group** is an expert body convened to provide strategic oversight, institutional coordination, and decision-making authority. The Group’s purpose is to provide oversight and ensure the network well represents the needs and contexts of different partners, stakeholders and rightsholders."

