  title: "CAN BON will help deliver on Canada's national and international commitments"
  left_title: "The 30x30 initiative"
  left_text: "Protecting **30%** of Canadian lands and waters by **2030**"
  right_text: | # NEEDED to preserve the line breaks
    Canada is advancing an ambitious [**"A Force of Nature" strategy**](https://www.canada.ca/en/services/environment/nature/nature-strategy.html), with a commitment of $3.8 billion for the 30x30 initiative.

    This is in alignment with the UN Convention on Biological Diversity (CBD) [**Kunming-Montreal Global Biodiversity Framework (KMGBF)**](https://www.cbd.int/gbf/targets).
