    description: "Le **Groupe consultatif scientifique** de ROB CAN est un groupe d'experts réuni pour fournir des orientations scientifiques et techniques indépendantes. Ce groupe a pour objectif de renforcer la crédibilité et la rigueur scientifiques de ROB CAN et de veiller à ce que le développement du réseau repose sur les meilleures données probantes, méthodes et pratiques disponibles."
    button : 
