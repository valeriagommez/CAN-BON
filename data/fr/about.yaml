introduction: 
  title: "À propos"
  subtitle: "La perte de biodiversité s'<span style='color:var(--red)'>**accélère**</span>"
  text: |
    Parallèlement, la demande de données sur la nature utiles à la prise de décision est croissante.

    Actuellement, l'information est fragmentée entre les universités, les gouvernements, les ONG, les communautés autochtones et les organisations privées, ce qui rend difficile la compréhension de l'état de la nature au Canada.

    Un **réseau d'observation de la biodiversité du Canada** jouerait un rôle clé dans la coordination des efforts de surveillance de la biodiversité et fournirait aux décideurs des renseignements crédibles, pertinents et opportuns.
  video_link: "https://www.youtube.com/watch?v=Qs68bEIbJmw"
  video_call_to_action: "Visionnez notre vidéo pour plus de détails!"

coordinating_body:
  title: "Coordinating body :"
  hosted_at: "Hosted at"
  temp_text: "This section will be updated soon."
  members:
    - name: "Andrew Gonzalez"
      position: "Chef"
      bio: |
        Andrew Gonzalez est professeur et titulaire de la Chaire Liber Ero sur la biodiversité au Département de biologie de l’Université McGill. Ses recherches portent sur les causes et les conséquences de l’érosion de la biodiversité, notamment sur la façon dont les répercussions humaines — telles que les effets sur la connectivité écologique, l’évolution rapide et les changements environnementaux — façonnent la répartition de la biodiversité et la résilience des écosystèmes.

        Il est membre de la Société royale du Canada, fondateur du Centre de la science de la biodiversité du Québec, coprésident du réseau GEO BON (Group on Earth Observations Biodiversity Observation Network), coprésident de l’évaluation de l’IPBES sur le suivi de la biodiversité et cofondateur de Habitat, une société de conseil en biodiversité établie à Montréal. Chercheur hautement cité (classement ISI), il a récemment reçu le prix « NOMIS Distinguished Scientist and Scholar Award », décerné aux chercheurs ayant apporté une contribution majeure à leur domaine grâce à des travaux interdisciplinaires novateurs. 
      image_name: "andrew-gonzalez.png"
    - name: "Charlotte Lombardi"
      position: "Directrice, Stratégie et partenariats"
      bio: |
        Charlotte est une professionnelle du développement durable titulaire d'un MBA et d'une certification PMP (gestion de projet), ayant suivi une formation de haut niveau sur la biodiversité et la durabilité des entreprises. Elle possède une expérience dans l'élaboration de stratégies de développement durable pour des entreprises canadiennes opérant dans les secteurs de la finance, de la technologie, de l'aérospatiale, des biens de consommation et des ressources naturelles. Dans le cadre de ses fonctions précédentes chez Millani, elle a piloté des projets phares liés au financement de la biodiversité, notamment une initiative de mobilisation des parties prenantes menée avec Environnement et Changement climatique Canada (ECCC).
      image_name: "charlotte-lombardi.jpeg"

working_groups: 
  title: "Groupes de travail"
  groups: 
  - title : "Groupe consultatif scientifique"
    image_name: "science-advisory.jpg"
    description: "Le **Groupe consultatif scientifique** de CAN BON est une instance d'experts réunie pour fournir des orientations scientifiques et techniques indépendantes. Ce groupe a pour mission de renforcer la crédibilité et la rigueur scientifiques de CAN BON et de veiller à ce que le développement du réseau repose sur les meilleures données probantes, méthodes et pratiques disponibles."
    button : 
      text: "Learn more"
      link: ""
  - title: "Groupe de pilotage provisoire"
    image_name: "interim-steering.jpg"
    description: "Le **groupe de pilotage provisoire** du CAN BON est une instance d'experts réunie pour assurer la supervision stratégique, la coordination institutionnelle et la prise de décision. Ce groupe a pour mission d'exercer une fonction de supervision et de veiller à ce que le réseau reflète fidèlement les besoins et les contextes des différents partenaires, parties prenantes et détenteurs de droits."
    button : 
        text: "Learn more"
        link: ""


