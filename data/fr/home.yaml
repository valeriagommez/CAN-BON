introduction : 
  introduction_title : "Réseau d'observation de la biodiversité du Canada"
  introduction_text : "Un système national coordonné pour surveiller la biodiversité sur les terres, les eaux et les côtes du Canada."

two_columns:
  title: "CAN BON contribuera aux engagements nationaux et internationaux du Canada"
  left_title: "L'initiative 30x30"
  left_text: "Protéger **30 %** des terres et des eaux canadiennes d'ici **2030**"
  right_text: | # NEEDED to preserve the line breaks
    Le Canada met en œuvre une stratégie ambitieuse [**« Une force de la nature »**](https://www.canada.ca/fr/services/environnement/nature/strategie-nature.html), avec un engagement de 3,8 milliards de dollars pour l'initiative 30x30.

    Cette initiative est conforme à la Convention des Nations Unies sur la diversité biologique (CDB) et le [**cadre mondial de Kunming-Montréal pour la biodiversité (CMMBB)**](https://www.cbd.int/gbf/targets).
  force_of_nature_text: "« Une force de la nature »"
