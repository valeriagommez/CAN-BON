introduction : 
  introduction_title : "Un réseau canadien d'observation de la biodiversité est essentiel"
  introduction_text : "Il contribuera à **coordonner les efforts de suivi de la biodiversité** et à fournir aux décideurs des **informations crédibles et pertinentes en temps opportun**. CAN BON est un outil essentiel qui éclairera les décisions et les projections à court et à long terme."

two_columns:
  left_title: "L'initiative 30x30"
  left_text: "Protéger **30 %** des terres et des eaux canadiennes d'ici **2030**"
  right_text: | # NEEDED to preserve the line breaks
    Le Canada met en œuvre une stratégie ambitieuse [**« Force pour la nature »**](https://www.canada.ca/fr/services/environnement/nature/strategie-nature.html), avec un engagement de 3,8 milliards de dollars pour l'initiative 30x30.

    Cette initiative est conforme à la Convention des Nations Unies sur la diversité biologique (CDB) et le [**cadre mondial de Kunming-Montréal pour la biodiversité (CMMBB)**](https://www.cbd.int/gbf/targets).

about_section: 
  about_title: "À propos"
  about_text: | # NEEDED to preserve the line breaks
    La nature subit une transformation majeure en raison des changements climatiques. La perte de biodiversité s'accélère, et avec elle les nombreux avantages économiques et culturels que nous retirons d'écosystèmes sains.

    Parallèlement, la demande de données utiles à la prise de décision augmente et il est crucial de généraliser l'information afin d'appuyer les décisions d'investissement.

    Pour atteindre ces objectifs, il faut disposer de données fiables et coordonnées sur l'évolution de la biodiversité au Canada.
  about_button_text : "En savoir plus"
  about_button_link : "/about"