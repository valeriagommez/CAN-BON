introduction : 
  introduction_title : "Groupe consultatif scientifique"
  introduction_text : "Le **Groupe consultatif scientifique** de CAN BON est une instance d'experts réunie pour fournir des orientations scientifiques et techniques indépendantes. Ce groupe a pour mission de renforcer la crédibilité et la rigueur scientifiques de CAN BON et de veiller à ce que le développement du réseau repose sur les meilleures données probantes, méthodes et pratiques disponibles."

