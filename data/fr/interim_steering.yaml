introduction : 
  introduction_title : "Groupe de pilotage provisoire"
  introduction_text : "Le **groupe de pilotage provisoire** du CAN BON est une instance d'experts réunie pour assurer la supervision stratégique, la coordination institutionnelle et la prise de décision. Ce groupe a pour mission d’exercer une fonction de supervision et de veiller à ce que le réseau reflète fidèlement les besoins et les contextes des différents partenaires, parties prenantes et détenteurs de droits."

