{{ $lang := .Site.Language.Name }}
{{ $d := index hugo.Data $lang "about" "development_plan" }}

<div class="about-page-development-plan">
    <div class="container">
        <div class="main-content">
            <h2 class="section-title">{{ $d.title}}</h2>
            <p>{{ $d.text}}</p>
            <div class="columns">
                <div class="step">
                    <img class="step-icon" src="/images/1.png">
                    <p class="step-name">{{ $d.first_step}}</p>
                </div>
                <div class="step">
                    <img class="step-icon" src="/images/2.png">
                    <p class="step-name">{{ $d.second_step}}</p>
                </div>
                <div class="step">
                    <img class="step-icon" src="/images/3.png">
                    <p class="step-name">{{ $d.third_step}}</p>
                </div>
                <div class="step">
                    <img class="step-icon" src="/images/4.png">
                    <p class="step-name">{{ $d.fourth_step}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
