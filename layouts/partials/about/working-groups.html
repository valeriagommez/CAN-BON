{{ $lang := .Site.Language.Lang }}
{{ $d := index hugo.Data $lang "about" "working_groups" }}

<div class="about-page-working-groups">
    <div class="container">
        <div class="main-content">
            <h2 class="section-title">{{ $d.title }}</h2>
            <div class="cards-container">
                <!-- will loop through every working group and display a card for each -->
                {{ range $d.groups }} 
                    {{ partial "about/working-groups-card.html" . }}
                {{ end }}
            </div>
        </div>
    </div>
</div>
