{{ $lang := .Site.Language.Lang }}
{{ $d := index hugo.Data $lang "home" "canada_bon_columns" }}

<div class="home-page-video container"
    style="background-image: url('{{ "images/bg-butterflies.png" | relURL }}');">
    <div class="main-content">
        <div class="columns">
            <div class="home-page-video column-left">
                <h2>{{ $d.left.title | markdownify}}</h2>
                <div class="text">
                    <p>{{ $d.left.text | markdownify}}</p>
                </div>
            </div>
            <div class="home-page-video column-right">
                <h2>{{ $d.right.title | markdownify}}</h2>
                <div class="text">
                    <p>{{ $d.right.text | markdownify}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
