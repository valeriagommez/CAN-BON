{{ $lang := .Site.Language.Lang }}
<!-- used to be .Site.Language.Name -->
{{ $d := index hugo.Data $lang "home" "header" }}

<div class="hero-home">
    <a href="{{ $d.home_link }}"><img class="navbar-logo home" src="{{ "images/logo-red.png" | relURL }}"></a>
    <div class="navbar-home">
        <div class="navbar-items left">
            <a class="navbar-items left" style="visibility: hidden;" href="/">
                <img class="navbar-logo" src="{{ "images/logo-white.png" | relURL }}">
                <p class="navbar-title">{{ $d.canbon }}</p>
            </a>
        </div>
        <div class="hero-right">
            <div class="navbar-items right"> 
                <a href="{{ $d.about_link | relURL }}" class="navbar-link">{{ $d.about }}</a>
                <a href="{{ $d.network_link | relURL }}" class="navbar-link">{{ $d.network }}</a>
                <a href="{{ $d.our_work_link | relURL }}" class="navbar-link">{{ $d.our_work }}</a>

                <a href="{{ $d.home_link | relURL }}" class="navbar-link {{ if eq .RelPermalink $d.home_link }}active{{ end }}">{{ $d.home }}</a>
                <a href="{{ $d.about_link | relURL }}" class="navbar-link {{ if eq .RelPermalink $d.about_link }}active{{ end }}">{{ $d.about }}</a>
                <a href="{{ $d.network_link | relURL }}" class="navbar-link {{ if eq .RelPermalink $d.network_link }}active{{ end }}">{{ $d.network }}</a>
                <a href="{{ $d.our_work_link | relURL }}" class="navbar-link {{ if eq .RelPermalink $d.our_work_link }}active{{ end }}">{{ $d.our_work }}</a>
                {{ range .Translations }}
                    <a class="lang-link" href="{{ .Permalink }}">{{ .Language.Name }}</a>
                {{ end }}
            </div>
        </div>
    </div>
</div>
