{{ $d := .Site.Data.home.two_columns }}

        <h3 style="color: white; margin-bottom: 0;">{{ $d.left_title }}</h3>
        <p>{{ $d.left_text | markdownify }}</p>
    </div>
    <div class="column right">
        {{ $d.right_text | markdownify }}
    </div>
</div>
