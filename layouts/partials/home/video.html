{{ $lang := .Site.Language.Lang }}
{{ $d := index hugo.Data $lang "home" "video" }}

<div class="home-page-video container"
    style="background-image: url('{{ "images/bg-butterflies.png" | relURL }}');">
    <div class="main-content">
        <div class="columns">
            <div class="home-page-video column-left">
                <p class="home-page-video subtitle">{{ $d.subtitle | markdownify}}</p>
                <div class="text">
                    <p>{{ $d.text | markdownify}}</p>
                </div>
            </div>
            <div class="home-page-video column-right">
                <iframe 
                    class="video"
                    width="560" 
                    height="315" 
                    src="https://www.youtube.com/embed/Qs68bEIbJmw?si=-Vf8n9K3cSkExHvg" 
                    title="Dr. Mary O'Connor and Dr. Andrew Gonzalez - Canadian Biodiversity Observation Network | UBC" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>
</div>
