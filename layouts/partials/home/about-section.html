{{ $lang := .Site.Language.Name }}
{{ $d := index .Site.Data $lang "home" "about_section" }}

<div class="about-section-container">
    <div class="about-section main-content">
        <h1 class="section-title">{{ $d.about_title }}</h1>
        <p>{{ $d.about_text | markdownify }}</p>
        <div class="button-container">
            <a class="button" href="{{ $d.about_button_link }}">{{ $d.about_button_text }}</a>
        </div>
    </div>
</div>
