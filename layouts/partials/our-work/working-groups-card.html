<div class="group-card">
    <div class="group-thumbnail"
    style='background-image: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)), url({{ printf "images/%s" (.image_name | default "default-bg.png") | relURL }})'>
        <p>{{ .title }}</p>
    </div>
    <p class="group-description">{{ .description | markdownify }}</p>
</div>
