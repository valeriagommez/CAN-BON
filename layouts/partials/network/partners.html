{{ $d := .Site.Data.network.partners }}

<div class="network-page-partners main-content">
    <div class="container">
        <h2 class="section-title">{{ $d.title }}</h2>
        <div class="logos-container">
            <!-- will loop through every logo and display it -->
            {{ range $d.logos }} 
                <a href="{{ .link | default "" }}">
                    <img class="partner-logo" src="/images/{{ .image_name }}" alt="{{ .name }}">
                </a>
            {{ end }}
        </div>
    </div>
</div>
